<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subraya library</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.5 system-ui, sans-serif;
        color: #1a1a1a;
        background: #fafafa;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        font-size: 18px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      #search {
        flex: 1;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      #export {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        cursor: pointer;
        white-space: nowrap;
      }
      #export:hover:not(:disabled) {
        background: #eee;
      }
      #export:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .ideas-bar {
        margin-bottom: 12px;
      }
      .idea-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .idea-chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
        overflow: hidden;
      }
      .idea-chip.active {
        border-color: #1a1a1a;
        background: #f0f0f0;
      }
      .idea-chip-label {
        font: inherit;
        border: none;
        background: none;
        padding: 5px 10px;
        cursor: pointer;
      }
      .idea-chip-delete {
        font: inherit;
        border: none;
        background: none;
        color: #cc4444;
        cursor: pointer;
        padding: 4px 8px 4px 0;
      }
      .idea-create-form {
        display: flex;
        gap: 6px;
      }
      #new-idea-name {
        flex: 1;
        font: inherit;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      #create-idea {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        cursor: pointer;
      }
      #result-count {
        margin: 0 0 12px;
        font-size: 12px;
        color: #666;
      }
      #empty {
        color: #666;
        display: none;
      }
      .highlight-item {
        background: #fff;
        border: 1px solid #e2e2e2;
        border-left: 4px solid transparent;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .highlight-text {
        margin: 0 0 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .highlight-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        font-size: 12px;
        color: #666;
        align-items: center;
      }
      .highlight-meta a {
        color: #666;
      }
      .idea-badge {
        background: #eef0ff;
        color: #3a3aa0;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .idea-assign-select {
        font: inherit;
        font-size: 12px;
        padding: 2px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .delete-button {
        margin-left: auto;
        font: inherit;
        font-size: 12px;
        border: 1px solid #cc4444;
        color: #cc4444;
        background: none;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .delete-button:hover {
        background: #cc4444;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Subraya library</h1>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search highlights…" aria-label="Search highlights" />
        <button id="export" type="button">Export Markdown</button>
      </div>
      <section class="ideas-bar">
        <div id="idea-chips" class="idea-chips"></div>
        <form id="idea-create-form" class="idea-create-form">
          <input id="new-idea-name" type="text" placeholder="New idea…" maxlength="80" aria-label="New idea name" required />
          <button id="create-idea" type="submit">Add idea</button>
        </form>
      </section>
      <p id="result-count"></p>
      <p id="empty">No highlights yet.</p>
      <div id="list"></div>
    </main>
    <script src="library.js"></script>
  </body>
</html>
